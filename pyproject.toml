[project]
name = "att-mz"
version = "0.1.15"
description = "面向 RPG Maker（RM）游戏的 Agent 汉化工具包"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "json-repair>=0.58.5",
    "loguru>=0.7.3",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
]

[project.scripts]
att-mz = "app.cli_main:main"

[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "maturin>=1.13.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
]

[tool.maturin]
module-name = "app._native"
python-source = "."
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]
include = ["app/persistence/schema/current.sql"]

[tool.maturin.sbom]
rust = false
auditwheel = false

[tool.basedpyright]
include = [
    "app",
    "main.py",
    "tests",
]
exclude = [
    ".venv",
    "__pycache__",
    "output",
    "outputs",
]
pythonVersion = "3.14"
stubPath = "typings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "output",
    "outputs",
]

[tool.ruff.lint]
extend-select = ["I"]
