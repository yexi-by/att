# ATT 随包 Formic 的当前高吞吐模板。config.toml 缺失时复制本文件创建。
# 已有活动配置保留原内容；不要把真实密钥提交到 Git。
# protocol 按服务选择 completions、responses 或 anthropic。
# URL 写到 API 版本这一层，例如 /v1。上下文大小请查模型说明。
protocol = "completions"
url = "https://api.example.com/v1"
api_key = "replace-with-api-key"
# 需要客户端身份或会话路由时填写；会话标识在同一作业内保持稳定。
# headers = { "user-agent" = "Formic/0.3.0", "x-opencode-session" = "formic-current-job" }
model = "model-name"
context_window_tokens = 131072

# 模型只能读文字时填 ["text"]；还能读图片时填 ["text", "image"]。
model_input_modalities = ["text"]

# 开启后每 250 毫秒向 stderr 输出进程规模观测。
metrics = false

# 可选：把这段 JSON 加到每次模型请求，供不同模型使用专有参数。
# 不要重复填写 Formic 自己生成的模型、消息、工具等字段。
# extra_body_json = '''{"temperature":0.2,"reasoning":{"effort":"high"}}'''

# 只有 protocol="anthropic" 时才填写。其他协议不要填写。
# anthropic_max_tokens = 16384

# 这三项分别限制连接、一次读取和整个请求的等待时间。单位是毫秒。
connect_timeout_ms = 30000
read_timeout_ms = 600000
request_timeout_ms = 1800000

# 网络临时失败时按顺序等待后重试。空数组表示不重试。
# 服务商要求等待太久时，Formic 会停止发起新请求。
retry_delays_ms = [1000, 2000, 5000]
max_retry_after_ms = 60000

# 服务商明确限制每分钟请求数时再填写。
# requests_per_minute = 600

[execution]
# llm_attempts 分别限制 worker 的结构化无效结果提交次数与每个上下文压缩分段的提交次数，均包含首次。
# 两项独立计数；设为 1 时首次无效即失败。普通工具参数错误和网络重试不计入这两项。
# 其余字段控制同时处理的任务数、重复调用停止线和上下文预留空间。
llm_attempts = 5
max_concurrent_units = 64
identical_tool_call_limit = 16
context_safety_tokens = 2048

[tools]
# 内置文字工具单次最多返回约 1 MB；所有内置工具最多同时运行 64 次。
max_result_bytes = 1048576
max_in_flight = 64

[tools.search]
# 开启文本搜索，并限制匹配数量和随结果返回的上下文行数。
enabled = true
max_matches = 1000
max_context_lines = 100

[tools.read]
# 开启文件读取。结果大小和并发数默认沿用 [tools]。
enabled = true

[cache]
# 缓存相同的搜索和读取结果，最多使用约 1 GB 内存。
enabled = true
max_bytes = 1073741824

[mcp_servers.http_example]
# 这是 HTTP MCP 示例。改好地址后把 enabled 设为 true。
enabled = false
url = "https://example.com/mcp"

# 认证信息和请求头直接写在当前 TOML 中。
bearer_token = ""
headers = { "x-client" = "formic" }

# 默认开放服务端提供的全部工具。需要限制时再填写 enabled_tools。
# job 表示整个作业共用会话；unit 表示每个任务单独使用会话。
# enabled_tools = ["search"]
tool_aliases = {}
session_scope = "job"

# 原始传输消息允许 8 MB；送入模型的最终结果最多 1 MB。
# 其余字段依次控制并发数、启动等待、调用等待和断线重连。
max_in_flight = 64
startup_timeout_sec = 60
tool_timeout_sec = 600
max_result_bytes = 1048576
max_message_bytes = 8388608
reconnect = true

[mcp_servers.http_example.tool_limits.search]
# 这里只单独限制 search 的并发数。
max_in_flight = 32

[mcp_servers.stdio_example]
# 这是本机命令型 MCP 示例。command 与上面的 HTTP url 只能选一种。
enabled = false
command = "mcp-server"
args = ["--stdio"]

# 子进程需要的业务环境变量直接写在当前 TOML 中。
env = { LOG_LEVEL = "warn" }

# 会话、并发、超时、原始消息和最终结果大小与 HTTP MCP 的含义相同。
tool_aliases = {}
session_scope = "job"
max_in_flight = 64
startup_timeout_sec = 60
tool_timeout_sec = 600
max_result_bytes = 1048576
max_message_bytes = 8388608
reconnect = true
